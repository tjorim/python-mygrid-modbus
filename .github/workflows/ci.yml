name: Validate library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run --python '${{ matrix.python }}' ruff check .
      - run: uv run --python '${{ matrix.python }}' ruff format --check .
      - run: uv run --python '${{ matrix.python }}' ty check .
      - run: uv run --python '${{ matrix.python }}' pytest --cov=mygrid_modbus --cov-report=term-missing:skip-covered
      - run: uv build --python '${{ matrix.python }}'
      - run: uv run --python '${{ matrix.python }}' twine check dist/*
      - run: uv run --python '${{ matrix.python }}' python scripts/check_artifacts.py
      - name: Import base wheel without transport backends
        run: |
          uv venv --python '${{ matrix.python }}' /tmp/mygrid-base-test
          uv pip install --python /tmp/mygrid-base-test/bin/python dist/*.whl
          /tmp/mygrid-base-test/bin/python -I -c "import importlib.util; import mygrid_modbus; assert all(importlib.util.find_spec(name) is None for name in ['homeassistant', 'tmodbus', 'pymodbus'])"
      - name: Test installed wheel without Home Assistant
        run: |
          uv venv --python '${{ matrix.python }}' /tmp/mygrid-wheel-test
          uv pip install --python /tmp/mygrid-wheel-test/bin/python dist/*.whl 'modbus-connection[tmodbus,pymodbus]==4.12.4' tmodbus==0.6.2 pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==7.1.0
          /tmp/mygrid-wheel-test/bin/python -I -c "import importlib.util; import mygrid_modbus; assert importlib.util.find_spec('homeassistant') is None"
          /tmp/mygrid-wheel-test/bin/python -m pytest
      - name: Test minimum supported pymodbus
        if: matrix.python == '3.12'
        run: |
          uv pip install --python /tmp/mygrid-wheel-test/bin/python pymodbus==3.13.1
          /tmp/mygrid-wheel-test/bin/python -m pytest
