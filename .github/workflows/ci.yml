name: Validate library
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run --python '${{ matrix.python }}' ruff check .
      - run: uv run --python '${{ matrix.python }}' ruff format --check .
      - run: uv run --python '${{ matrix.python }}' mypy
      - run: uv run --python '${{ matrix.python }}' pytest
      - run: uv build --python '${{ matrix.python }}'
      - run: uv run --python '${{ matrix.python }}' twine check dist/*
      - run: uv run --python '${{ matrix.python }}' python scripts/check_artifacts.py
      - name: Test installed wheel without Home Assistant
        run: |
          uv venv --python '${{ matrix.python }}' /tmp/mygrid-wheel-test
          uv pip install --python /tmp/mygrid-wheel-test/bin/python dist/*.whl pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==7.1.0
          /tmp/mygrid-wheel-test/bin/python -I -c "import importlib.util; import mygrid_modbus; assert importlib.util.find_spec('homeassistant') is None"
          /tmp/mygrid-wheel-test/bin/python -m pytest
      - name: Test minimum supported pymodbus
        if: matrix.python == '3.12'
        run: |
          uv pip install --python /tmp/mygrid-wheel-test/bin/python pymodbus==3.13.1
          /tmp/mygrid-wheel-test/bin/python -m pytest
