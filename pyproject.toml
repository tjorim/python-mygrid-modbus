[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mygrid-modbus"
dynamic = ["version"]
description = "Typed async Modbus TCP client for MyGrid ModuleTwo home batteries"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "mygrid-modbus contributors"}]
keywords = ["mygrid", "modbus", "battery", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["modbus-connection>=4.12.4,<5"]

[project.scripts]
mygrid-query = "mygrid_modbus.cli:main"

[project.optional-dependencies]
tmodbus = ["modbus-connection[tmodbus]>=4.12.4,<5"]
pymodbus = ["modbus-connection[pymodbus]>=4.12.4,<5"]

[project.urls]
Documentation = "https://github.com/tjorim/python-mygrid-modbus#readme"
Source = "https://github.com/tjorim/python-mygrid-modbus"
Issues = "https://github.com/tjorim/python-mygrid-modbus/issues"

[dependency-groups]
dev = [
    "modbus-connection[tmodbus,pymodbus]==4.12.5",
    "tmodbus==0.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "ty>=0.0.90",
    "build>=1.3,<2",
    "twine==7.0.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/mygrid_modbus"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/scripts", "/script", "/README.md", "/LICENSE",
    "/pyproject.toml", "/uv.lock", "/.python-version",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not live' --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "simulator: real TCP protocol tests against a local battery simulator",
    "live: smoke tests against a real ModuleTwo (set MYGRID_HOST); excluded from ordinary runs",
]

[tool.coverage.run]
branch = true
source = ["mygrid_modbus"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "E501",
    "ISC001",
    "PLR0913",
    "PLR0917",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
# The offline suite predates the annotation rules; type it incrementally.
"tests/**" = [
    "ANN",
    "ARG001",
    "ARG005",
    "D",
    "INP001",
    "PLC0415",
    "PLR2004",
    "S101",
    "SLF001",
]
"script/**" = ["INP001"]
"scripts/**" = ["INP001", "S101", "T201"]
"tests/simulator.py" = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ty.src]
# Tests are not annotated yet (see the ruff ignore above).
exclude = ["tests"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
